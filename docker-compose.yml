services:
  spark-events-init:
    image: ${SPARK_LEARNING_IMAGE:-openfinance-spark-learning:4.1.2-iceberg1.12}
    build:
      context: .
      dockerfile: spark/Dockerfile
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-docker.1ms.run/apache/spark:4.1.2-python3}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /opt/openfinance/.cache/spark/events && chmod 777 /opt/openfinance/.cache/spark/events"]
    volumes:
      - .:/opt/openfinance
    restart: "no"

  spark-master:
    image: ${SPARK_LEARNING_IMAGE:-openfinance-spark-learning:4.1.2-iceberg1.12}
    build:
      context: .
      dockerfile: spark/Dockerfile
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-docker.1ms.run/apache/spark:4.1.2-python3}
    container_name: openfinance-spark-master
    restart: unless-stopped
    depends_on:
      spark-events-init:
        condition: service_completed_successfully
    environment:
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://openfinance-warehouse/}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - .:/opt/openfinance
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    working_dir: /opt/openfinance

  spark-worker:
    image: ${SPARK_LEARNING_IMAGE:-openfinance-spark-learning:4.1.2-iceberg1.12}
    build:
      context: .
      dockerfile: spark/Dockerfile
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-docker.1ms.run/apache/spark:4.1.2-python3}
    container_name: openfinance-spark-worker
    restart: unless-stopped
    environment:
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://openfinance-warehouse/}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance}
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
    ports:
      - "8082:8081"
    volumes:
      - .:/opt/openfinance
    working_dir: /opt/openfinance

  spark-history-server:
    image: ${SPARK_LEARNING_IMAGE:-openfinance-spark-learning:4.1.2-iceberg1.12}
    container_name: openfinance-spark-history-server
    user: root
    restart: unless-stopped
    depends_on:
      spark-events-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - .:/opt/openfinance:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openfinance-backend
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      embedding-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
      MINIO_ENDPOINT: minio:9000
      ICEBERG_CATALOG_URI: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      OPENFINANCE_INTERNAL_API_BASE_URL: http://backend:8000
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
      OPENSEARCH_URL: http://opensearch:9200
      EMBEDDING_BASE_URL: http://embedding:11434/v1
      EMBEDDING_API_KEY: ${LOCAL_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_PATH: /embeddings
      EMBEDDING_DIMENSION: ${LOCAL_EMBEDDING_DIMENSION:-1024}
      PDF_PARSER_URL: http://pdf-parser:8090
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-replace-with-pdf-parser-token}
      RAY_RUNTIME_WORKING_DIR: ${RAY_RUNTIME_WORKING_DIR:-/app}
      RAY_CPU_TASK_CPUS: ${RAY_CPU_TASK_CPUS:-4}
      RAY_GPU_TASK_CPUS: ${RAY_GPU_TASK_CPUS:-4}
      RAY_MAX_IN_FLIGHT_REPORTS: ${RAY_MAX_IN_FLIGHT_REPORTS:-24}
      RAY_CPU_RESOURCE_LABEL: ${RAY_CPU_RESOURCE_LABEL:-annual_report_cpu}
      RAY_GPU_RESOURCE_LABEL: ${RAY_GPU_RESOURCE_LABEL:-annual_report_gpu}
      RAY_JOB_TIMEOUT_SECONDS: ${RAY_JOB_TIMEOUT_SECONDS:-14400}
      RAY_JOB_POLL_SECONDS: ${RAY_JOB_POLL_SECONDS:-5}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000

  pdf-parser:
    profiles: ["legacy-parser"]
    build:
      context: .
      dockerfile: pdf-parser/Dockerfile
      args:
        PDF_PARSER_BASE_IMAGE: ${PDF_PARSER_BASE_IMAGE:-docker.1ms.run/nvidia/cuda:12.9.1-cudnn-runtime-ubuntu22.04}
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-https://archive.ubuntu.com/ubuntu}
    container_name: openfinance-pdf-parser
    restart: unless-stopped
    gpus: all
    depends_on:
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_DERIVED_BUCKET: ${MINIO_DERIVED_BUCKET:-openfinance-derived}
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-replace-with-pdf-parser-token}
      PDF_PARSER_VERSION: ${PDF_LEGACY_PARSER_VERSION:-annual-report-parser-v1}
      PDF_LAYOUT_ENGINE: paddle
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-200}
      PDF_OCR_CONFIDENCE_THRESHOLD: ${PDF_OCR_CONFIDENCE_THRESHOLD:-0.78}
      DISABLE_MODEL_SOURCE_CHECK: "True"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - .:/app
      - pdf_parser_models:/root/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
      MINIO_ENDPOINT: minio:9000
      ICEBERG_CATALOG_URI: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
    volumes:
      - .:/app
    command: ["python", "-m", "backend.workers.a_share_ingestion_worker"]

  embedding:
    image: ${LOCAL_EMBEDDING_IMAGE:-docker.1ms.run/ollama/ollama:latest}
    container_name: openfinance-embedding
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "2"
    ports:
      - "127.0.0.1:8001:11434"
    volumes:
      - embedding_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  embedding-init:
    image: ${LOCAL_EMBEDDING_IMAGE:-docker.1ms.run/ollama/ollama:latest}
    container_name: openfinance-embedding-init
    depends_on:
      embedding:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://embedding:11434
    command: ["pull", "${LOCAL_EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"

  normalization-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
      MINIO_ENDPOINT: minio:9000
      ICEBERG_CATALOG_URI: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
    volumes:
      - .:/app
    command: ["python", "-m", "backend.workers.finance_normalization_worker"]

  monitor-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      embedding-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
      MINIO_ENDPOINT: minio:9000
      ICEBERG_CATALOG_URI: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
      EMBEDDING_BASE_URL: http://embedding:11434/v1
      EMBEDDING_API_KEY: ${LOCAL_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_PATH: /embeddings
      EMBEDDING_DIMENSION: ${LOCAL_EMBEDDING_DIMENSION:-1024}
    volumes:
      - .:/app
    command: ["python", "-m", "backend.workers.monitor_worker"]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: openfinance-postgres
    environment:
      POSTGRES_DB: openfinance
      POSTGRES_USER: openfinance
      POSTGRES_PASSWORD: openfinance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfinance -d openfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bootstrap:
    image: pgvector/pgvector:pg16
    container_name: openfinance-postgres-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: openfinance
    command:
      - bash
      - -c
      - |
        set -e

        until pg_isready -h postgres -U openfinance -d postgres; do
          echo "waiting for postgres..."
          sleep 2
        done

        if ! psql -h postgres -U openfinance -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = 'openfinance'" \
          | grep -q 1; then
          echo "creating database openfinance..."
          createdb -h postgres -U openfinance openfinance
        else
          echo "database openfinance already exists"
        fi

        if ! psql -h postgres -U openfinance -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = 'airflow'" \
          | grep -q 1; then
          echo "creating database airflow..."
          createdb -h postgres -U openfinance airflow
        else
          echo "database airflow already exists"
        fi

        psql -h postgres -U openfinance -d openfinance -c "CREATE EXTENSION IF NOT EXISTS vector;"

        echo "database bootstrap completed"
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: openfinance-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-replace-with-a-strong-password}
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: openfinance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: openfinance-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/openfinance-bronze &&
      mc mb --ignore-existing local/openfinance-derived &&
      mc mb --ignore-existing local/openfinance-warehouse
      "
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: openfinance-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/openfinance/airflow/dags
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://openfinance:openfinance@postgres:5432/airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-replace-with-a-generated-fernet-key}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-replace-with-a-secret-key}
      PYTHONPATH: /opt/openfinance
      OPENFINANCE_ROOT: /opt/openfinance
      OPENFINANCE_INTERNAL_API_BASE_URL: http://backend:8000
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://openfinance-warehouse/}
      NEWS_INGEST_LIMIT: ${NEWS_INGEST_LIMIT:-20}
      NEWS_INGEST_LOOKBACK_HOURS: ${NEWS_INGEST_LOOKBACK_HOURS:-6}
      NEWS_AIRFLOW_SCHEDULE: ${NEWS_AIRFLOW_SCHEDULE:-*/30 * * * *}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-OpenFinance}
      _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - .:/opt/openfinance
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --role Admin
      --username $${_AIRFLOW_WWW_USER_USERNAME}
      --password $${_AIRFLOW_WWW_USER_PASSWORD}
      --firstname $${_AIRFLOW_WWW_USER_FIRSTNAME}
      --lastname $${_AIRFLOW_WWW_USER_LASTNAME}
      --email $${_AIRFLOW_WWW_USER_EMAIL} || true
      "
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: openfinance-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/openfinance/airflow/dags
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://openfinance:openfinance@postgres:5432/airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-replace-with-a-generated-fernet-key}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-replace-with-a-secret-key}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      PYTHONPATH: /opt/openfinance
      OPENFINANCE_ROOT: /opt/openfinance
      OPENFINANCE_INTERNAL_API_BASE_URL: http://backend:8000
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://openfinance-warehouse/}
      NEWS_INGEST_LIMIT: ${NEWS_INGEST_LIMIT:-20}
      NEWS_INGEST_LOOKBACK_HOURS: ${NEWS_INGEST_LOOKBACK_HOURS:-6}
      NEWS_AIRFLOW_SCHEDULE: ${NEWS_AIRFLOW_SCHEDULE:-*/30 * * * *}
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/openfinance
      - airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: openfinance-airflow-scheduler
    depends_on:
      spark-events-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/openfinance/airflow/dags
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://openfinance:openfinance@postgres:5432/airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-replace-with-a-generated-fernet-key}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-replace-with-a-secret-key}
      PYTHONPATH: /opt/openfinance
      OPENFINANCE_ROOT: /opt/openfinance
      OPENFINANCE_INTERNAL_API_BASE_URL: http://backend:8000
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://openfinance-warehouse/}
      NEWS_INGEST_LIMIT: ${NEWS_INGEST_LIMIT:-20}
      NEWS_INGEST_LOOKBACK_HOURS: ${NEWS_INGEST_LOOKBACK_HOURS:-6}
      NEWS_AIRFLOW_SCHEDULE: ${NEWS_AIRFLOW_SCHEDULE:-*/30 * * * *}
    volumes:
      - .:/opt/openfinance
      - airflow_logs:/opt/airflow/logs
    command: scheduler

  kafka:
    image: ${REALTIME_KAFKA_IMAGE:-docker.1ms.run/apache/kafka:3.9.1}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: ${REALTIME_KAFKA_RETENTION_HOURS:-24}
    volumes:
      - realtime_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
  flink-jobmanager:
    build:
      context: .
      dockerfile: realtime/Dockerfile.flink
    command: jobmanager
    depends_on:
      flink-checkpoint-init: {condition: service_completed_successfully}
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 5 s
    ports: ["127.0.0.1:8083:8081"]
    volumes: ["realtime_checkpoints:/opt/flink/checkpoints"]
  flink-checkpoint-init:
    build:
      context: .
      dockerfile: realtime/Dockerfile.flink
    user: root
    entrypoint: ["/bin/sh", "-c", "chown flink:flink /opt/flink/checkpoints"]
    volumes: ["realtime_checkpoints:/opt/flink/checkpoints"]
  flink-taskmanager:
    build:
      context: .
      dockerfile: realtime/Dockerfile.flink
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes: ["realtime_checkpoints:/opt/flink/checkpoints"]
  flink-submit:
    build:
      context: .
      dockerfile: realtime/Dockerfile.flink
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      flink-jobmanager: {condition: service_started}
      flink-taskmanager: {condition: service_started}
    environment:
      QUOTE_LATENESS_SECONDS: ${QUOTE_LATENESS_SECONDS:-120}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
    volumes: ["./realtime/job.sql:/opt/flink/job.sql:ro", "./realtime/submit.sh:/opt/flink/submit.sh:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /bin/bash /opt/flink/submit.sh"]
    restart: on-failure
  kafka-init:
    image: ${REALTIME_KAFKA_IMAGE:-docker.1ms.run/apache/kafka:3.9.1}
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command: ["for topic in quotes.raw quotes.latest quotes.windows quotes.market quotes.late; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1 || exit 1; done"]
  quote-collector:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      backend: {condition: service_started}
    environment:
      QUOTE_SYMBOLS: ${QUOTE_SYMBOLS:-600519.SH,000001.SZ}
      QUOTE_MODE: ${QUOTE_MODE:-live}
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
      CALENDAR_URL: http://backend:8000/internal/jobs/trading-day
      UNIVERSE_URL: http://backend:8000/internal/jobs/realtime-universe
      OPENFINANCE_INTERNAL_API_TOKEN: ${OPENFINANCE_INTERNAL_API_TOKEN:-replace-with-a-shared-internal-token}
    command: ["python", "-m", "realtime.collector"]
    restart: unless-stopped
  quote-consumer:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      backend: {condition: service_started}
    environment:
      DATABASE_URL: postgresql://openfinance:openfinance@postgres:5432/openfinance
    command: ["python", "-m", "realtime.consumer"]
    restart: unless-stopped

volumes:
  realtime_kafka:
  realtime_checkpoints:
  postgres_data:
  minio_data:
  airflow_logs:
  opensearch_data:
  embedding_data:
  pdf_parser_models:
