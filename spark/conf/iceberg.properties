spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalogImplementation=in-memory
spark.sql.warehouse.dir=file:/tmp/spark-warehouse
spark.sql.defaultCatalog=openfinance

spark.sql.catalog.openfinance=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.openfinance.type=jdbc
spark.sql.catalog.openfinance.uri=jdbc:postgresql://postgres:5432/openfinance
spark.sql.catalog.openfinance.jdbc.user=${env:POSTGRES_USER}
spark.sql.catalog.openfinance.jdbc.password=${env:POSTGRES_PASSWORD}
spark.sql.catalog.openfinance.warehouse=${env:ICEBERG_WAREHOUSE}

spark.sql.catalog.openfinance.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.openfinance.s3.endpoint=http://minio:9000
spark.sql.catalog.openfinance.s3.path-style-access=true
spark.sql.catalog.openfinance.s3.access-key-id=${env:MINIO_ACCESS_KEY}
spark.sql.catalog.openfinance.s3.secret-access-key=${env:MINIO_SECRET_KEY}
spark.sql.catalog.openfinance.client.region=us-east-1
